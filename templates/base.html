{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}School Management System{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <link rel="stylesheet" href="{% url 'school_css' %}">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-school mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">{{ school.name }}</a>
    {% if user.is_authenticated %}
  <a class="nav-link text-white ms-3" href="{% url 'student_list' %}">Students</a>
{% endif %}
    {% if user.is_authenticated %}
  <span class="navbar-text text-white me-3">{{ user.get_username }}</span>
  <form method="post" action="{% url 'logout' %}" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-light">Sign out</button>
  </form>
{% endif %}
  </div>
</nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
