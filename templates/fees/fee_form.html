{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h4 mb-3">{{ title }}</h1>
    <form method="post">
      {% csrf_token %}
      {% for e in form.non_field_errors %}<div class="alert alert-danger">{{ e }}</div>{% endfor %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-school">Save</button>
      <a href="{% url 'fees:setup' %}" class="ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
