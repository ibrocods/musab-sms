{% extends 'base.html' %}
{% block title %}Design check{% endblock %}
{% block content %}
<h1 class="h4 mb-3" style="color: var(--text-strong); font-weight: 600;">Design check</h1>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4);">
  <div style="background: var(--school-primary); color: #fff; border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-card);">
    <div style="font-size: 0.85rem; opacity: 0.85;">Enrolled students</div>
    <div class="num" style="font-size: 2.25rem; font-weight: 700;">120</div>
  </div>
  <div style="background: var(--school-accent); color: #fff; border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-card);">
    <div style="font-size: 0.85rem; opacity: 0.85;">Active teachers</div>
    <div class="num" style="font-size: 2.25rem; font-weight: 700;">1</div>
  </div>
  <div style="background: var(--surface-card); color: var(--text-body); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-card);">
    <div style="font-size: 0.85rem; color: var(--text-muted);">Balance owed</div>
    <div class="num" style="font-size: 2.25rem; font-weight: 600; color: var(--text-strong);">₦45,000.00</div>
  </div>
</div>

<p class="mt-4" style="color: var(--text-muted);">
  If this text is in Inter, the font is loaded. The numbers should line up in a column.
</p>
{% endblock %}
